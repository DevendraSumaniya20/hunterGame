# Fresh app launch with location allowed; permission values differ per platform.
appId: com.dsumniya.huntinggame
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: inuse
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: allow
      # Android's local-network ("nearby devices") prompt is not covered by `all: allow`.
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 8000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
# Debug builds download the JS bundle from Metro after a data clear (slow on Android emulators).
- extendedWaitUntil:
    visible:
      id: tab-play
    timeout: 120000
