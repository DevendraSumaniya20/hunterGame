# Fly.io config for the game server. See DEPLOY.md.
app = "hunter-game-dsumniya"   # must match PROD_SERVER_URL in app/src/config.ts
primary_region = "bom"         # Mumbai

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/hunt.db"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # Live games are kept in memory: exactly one machine, never stopped.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "hunt_data"
  destination = "/data"
